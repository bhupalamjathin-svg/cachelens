# Second CI system alongside Jenkins: the same test -> build -> image flow, run by GitHub on every push.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Compute version
        run: echo "VERSION=1.0.${{ github.run_number }}-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: mvn -B clean test

      - name: Package versioned JAR
        run: mvn -B package -DskipTests -Drevision=$VERSION

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: cachelens-${{ env.VERSION }}
          path: target/cachelens-${{ env.VERSION }}.jar

      - name: Build Docker image (multi-stage)
        run: docker build --build-arg REVISION=$VERSION -t cachelens:$VERSION .
