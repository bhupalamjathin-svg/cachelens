# Target host = a Docker container running systemd (see target/Dockerfile).
# Ansible talks to it through the Docker API, so no SSH keys are needed.
[app_servers]
cachelens-target ansible_connection=community.docker.docker ansible_user=root ansible_python_interpreter=/usr/bin/python3

# Alternative: a real VM over SSH (comment the line above, uncomment below)
# vm1 ansible_host=192.168.56.10 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa
