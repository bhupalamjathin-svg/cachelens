---
- name: Install Java runtime
  ansible.builtin.apt:
    name:
      - "{{ java_package }}"
      - curl
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create service user
  ansible.builtin.user:
    name: "{{ app_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create application and config directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0755"
  loop:
    - "{{ app_dir }}"
    - "{{ app_config_dir }}"

- name: Copy application JAR ({{ artifact_src | basename }})
  ansible.builtin.copy:
    src: "{{ artifact_src }}"
    dest: "{{ app_dir }}/{{ app_name }}.jar"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0644"
  notify: Restart cachelens

- name: Write environment file (port, cache policy, capacity)
  ansible.builtin.template:
    src: cachelens.env.j2
    dest: "{{ app_config_dir }}/{{ app_name }}.env"
    owner: root
    group: "{{ app_user }}"
    mode: "0640"
  notify: Restart cachelens

- name: Install systemd unit
  ansible.builtin.template:
    src: cachelens.service.j2
    dest: /etc/systemd/system/{{ app_name }}.service
    mode: "0644"
  notify: Restart cachelens

- name: Enable and start service
  ansible.builtin.systemd:
    name: "{{ app_name }}"
    enabled: true
    state: started
    daemon_reload: true

# Run the restart now (if needed) so the health check below tests the new version
- name: Apply pending restarts
  ansible.builtin.meta: flush_handlers

- name: Wait for the app to listen on port {{ app_port }}
  ansible.builtin.wait_for:
    port: "{{ app_port }}"
    timeout: 90

- name: Health check
  ansible.builtin.uri:
    url: "http://localhost:{{ app_port }}/actuator/health"
    return_content: true
  register: health
  retries: 10
  delay: 3
  until: health.status == 200

- name: Show deployed version
  ansible.builtin.uri:
    url: "http://localhost:{{ app_port }}/"
    return_content: true
  register: info

- name: Report
  ansible.builtin.debug:
    msg: "{{ app_name }} {{ info.json.version }} is UP on port {{ app_port }} (policy={{ info.json.policy }}, capacity={{ info.json.capacity }})"
